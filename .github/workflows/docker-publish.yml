name: Build & Publish Multi-Arch Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_run:
    workflows: ["Sync Upstream"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & Push (amd64 / arm64)
    runs-on: ubuntu-latest
    # 如果是由 upstream-sync 触发的，仅当其成功时才运行
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 将镜像名转为全小写，避免用户名含大写字母导致 GHCR 报错
      - name: Normalize image name
        id: image_name
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/muse2api"
          echo "ref=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # 设置 QEMU 模拟器，支持跨架构构建 (linux/arm64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      # 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录到 GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 自动生成镜像 Tags
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_name.outputs.ref }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      # 构建并推送多架构镜像 (linux/amd64, linux/arm64)
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image tags
        run: |
          echo "Multi-arch image published successfully!"
          echo "Tags:"
          echo "${{ steps.meta.outputs.tags }}"
